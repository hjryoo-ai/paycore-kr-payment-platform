# GitHub Actions — Jenkins 파이프라인과 같은 단계를 공개 저장소에서 병행 실행한다 (docs §10.1).
#
# 순서 원칙은 Jenkinsfile 과 같다: 싼 검증을 먼저. 포맷 위반 때문에 Oracle 컨테이너를
# 띄우는 통합 테스트를 20분 돌리고 나서 실패하는 것은 낭비다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 의존성 취약점은 코드가 그대로여도 새로 발견된다. 주 1회 다시 스캔한다.
    - cron: '0 18 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Seoul

jobs:
  verify:
    name: 빌드 · 포맷 · 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 (테스트 제외)
        run: ./gradlew build -x test --no-daemon

      - name: 포맷 검사
        run: ./gradlew spotlessCheck --no-daemon

      - name: 단위 테스트
        run: ./gradlew :common:test :payment-core:test --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/test/**'
          if-no-files-found: ignore

  integration:
    name: 통합 테스트 (Testcontainers)
    runs-on: ubuntu-latest
    needs: verify
    # Oracle 컨테이너 기동이 느리다. 러너 표준 6시간보다 훨씬 짧게 잡아 매달리지 않게 한다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 통합 테스트
        run: |
          ./gradlew :payment-api:test :clearing-gateway:test :clearing-simulator:test \
                    :ledger-service:test :recon-batch:test --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: '**/build/reports/tests/test/**'
          if-no-files-found: ignore

  security:
    name: 보안 스캔
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 가 히스토리를 훑어야 한다. 얕은 클론이면 과거 커밋의 시크릿을 못 본다.
          fetch-depth: 0

      - name: 시크릿 스캔 (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      # NVD API 키가 없으면 극도로 느리다. 없어도 돌긴 하므로 실패시키지 않는다.
      - name: 의존성 취약점 스캔 (CVSS 7 이상이면 실패)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAggregate --no-daemon

      - name: 스캔 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.*
          if-no-files-found: ignore

  smoke:
    name: 로컬 스택 스모크
    runs-on: ubuntu-latest
    needs: [verify, integration]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 이미지 빌드
        run: scripts/build-images.sh

      - name: 스택 기동
        run: |
          docker compose up -d
          scripts/wait-for-healthy.sh 600

      # "떴는가"가 아니라 "돈이 끝까지 흘렀는가"를 본다.
      - name: 스모크 (접수 → 청산 → 원장 → 대사)
        run: scripts/smoke-test.sh

      - name: 실패 시 로그 수집
        if: failure()
        run: docker compose logs --no-color --tail 500

      - name: 정리
        if: always()
        run: docker compose down -v
