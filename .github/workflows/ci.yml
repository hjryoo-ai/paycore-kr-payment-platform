# GitHub Actions — Jenkins 파이프라인과 같은 단계를 공개 저장소에서 병행 실행한다 (docs §10.1).
#
# 순서 원칙은 Jenkinsfile 과 같다: 싼 검증을 먼저. 포맷 위반 때문에 Oracle 컨테이너를
# 띄우는 통합 테스트를 20분 돌리고 나서 실패하는 것은 낭비다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 손으로 파이프라인을 다시 돌리기 위한 입구.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Seoul

jobs:
  verify:
    name: 빌드 · 포맷 · 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 (테스트 제외)
        run: ./gradlew build -x test --no-daemon

      - name: 포맷 검사
        run: ./gradlew spotlessCheck --no-daemon

      - name: 단위 테스트
        run: ./gradlew :common:test :payment-core:test --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/test/**'
          if-no-files-found: ignore

  frontend:
    name: 대시보드 빌드 · 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ops-dashboard/package-lock.json

      - name: 의존성 설치
        working-directory: ops-dashboard
        run: npm ci

      - name: 테스트
        working-directory: ops-dashboard
        run: npm test

      # tsc --noEmit 이 build 스크립트에 포함되어 있다. 타입 오류는 빌드 실패다.
      - name: 빌드
        working-directory: ops-dashboard
        run: npm run build

  integration:
    name: 통합 테스트 (Testcontainers)
    runs-on: ubuntu-latest
    needs: verify
    # Oracle 컨테이너 기동이 느리다. 러너 표준 6시간보다 훨씬 짧게 잡아 매달리지 않게 한다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 통합 테스트
        run: |
          ./gradlew :payment-api:test :clearing-gateway:test :clearing-simulator:test \
                    :ledger-service:test :recon-batch:test --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: '**/build/reports/tests/test/**'
          if-no-files-found: ignore

  secrets:
    name: 시크릿 스캔
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 가 히스토리를 훑어야 한다. 얕은 클론이면 과거 커밋의 시크릿을 못 본다.
          fetch-depth: 0

      - name: 시크릿 스캔 (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-graph:
    name: 의존성 그래프 제출
    runs-on: ubuntu-latest
    # 여기서 올린 그래프를 GitHub 이 Dependabot 경보의 입력으로 쓴다. Gradle 멀티모듈은
    # GitHub 이 저장소만 보고는 정확히 읽어내지 못하므로 빌드가 직접 해석해 제출한다.
    # main 의 상태만 의미가 있다 — PR 마다 그래프를 덮어쓰면 안 된다.
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      # 이 액션이 Gradle 설정까지 포함한다. setup-gradle 을 따로 두지 않는다.
      - name: 의존성 그래프 제출
        uses: gradle/actions/dependency-submission@v4

  smoke:
    name: 로컬 스택 스모크
    runs-on: ubuntu-latest
    needs: [verify, integration, frontend]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 이미지 빌드
        run: scripts/build-images.sh

      - name: 스택 기동
        run: |
          docker compose up -d
          scripts/wait-for-healthy.sh 600

      # "떴는가"가 아니라 "돈이 끝까지 흘렀는가"를 본다.
      - name: 스모크 (접수 → 청산 → 원장 → 대사)
        run: scripts/smoke-test.sh

      - name: 실패 시 로그 수집
        if: failure()
        run: docker compose logs --no-color --tail 500

      - name: 정리
        if: always()
        run: docker compose down -v
