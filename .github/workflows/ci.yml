# GitHub Actions — Jenkins 파이프라인과 같은 단계를 공개 저장소에서 병행 실행한다 (docs §10.1).
#
# 순서 원칙은 Jenkinsfile 과 같다: 싼 검증을 먼저. 포맷 위반 때문에 Oracle 컨테이너를
# 띄우는 통합 테스트를 20분 돌리고 나서 실패하는 것은 낭비다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # NVD 스캔의 유일한 입구. 주기 실행은 두지 않는다 — ADR-0011 의 "결과" 절을 볼 것.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Seoul

jobs:
  verify:
    name: 빌드 · 포맷 · 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 (테스트 제외)
        run: ./gradlew build -x test --no-daemon

      - name: 포맷 검사
        run: ./gradlew spotlessCheck --no-daemon

      - name: 단위 테스트
        run: ./gradlew :common:test :payment-core:test --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/test/**'
          if-no-files-found: ignore

  frontend:
    name: 대시보드 빌드 · 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ops-dashboard/package-lock.json

      - name: 의존성 설치
        working-directory: ops-dashboard
        run: npm ci

      - name: 테스트
        working-directory: ops-dashboard
        run: npm test

      # tsc --noEmit 이 build 스크립트에 포함되어 있다. 타입 오류는 빌드 실패다.
      - name: 빌드
        working-directory: ops-dashboard
        run: npm run build

  integration:
    name: 통합 테스트 (Testcontainers)
    runs-on: ubuntu-latest
    needs: verify
    # Oracle 컨테이너 기동이 느리다. 러너 표준 6시간보다 훨씬 짧게 잡아 매달리지 않게 한다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 통합 테스트
        run: |
          ./gradlew :payment-api:test :clearing-gateway:test :clearing-simulator:test \
                    :ledger-service:test :recon-batch:test --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: '**/build/reports/tests/test/**'
          if-no-files-found: ignore

  secrets:
    name: 시크릿 스캔
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 가 히스토리를 훑어야 한다. 얕은 클론이면 과거 커밋의 시크릿을 못 본다.
          fetch-depth: 0

      - name: 시크릿 스캔 (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: 의존성 취약점 스캔 (NVD)
    runs-on: ubuntu-latest
    # push 마다 돌리지 않는다. NVD API 는 키가 없으면 5 req/30s 라 첫 적재만 두 시간대이고,
    # 무엇보다 외부 API 의 가용성에 코드 푸시가 인질로 잡힌다. 푸시 게이트는 gitleaks 가 맡는다.
    # 수동 실행 전용이다. 즉 아무도 돌리지 않으면 아무도 모른다 — ADR-0011 참고.
    if: github.event_name == 'workflow_dispatch'
    # 캐시가 비어 있고 NVD_API_KEY 도 없는 콜드 실행의 실측치가 2시간 25분이다.
    # 90분으로 잡으면 타임아웃이 곧 실패로 보인다 — 원인은 느린 것뿐인데도.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      # NVD 로컬 DB 는 setup-gradle 의 캐시 대상이 아니다. 명시하지 않으면 매 실행이 전체 재적재다.
      # restore/save 를 나눠 둔 이유: 취약점이 발견돼 job 이 실패해도 받아둔 DB 는 남겨야 한다.
      # 실패 시 캐시를 저장하지 않으면 영원히 전체 재적재만 반복하게 된다.
      - name: NVD DB 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-data-${{ github.run_id }}
          restore-keys: nvd-data-

      # 키가 없으면 dependency-check 13.x 는 빈 문자열을 NVD 로 보내고 거절당한다.
      # 그때 나오는 메시지가 "length of 0 too short to provided a masked partial key" 라
      # 원인이 전혀 드러나지 않는다. 몇 분 태우고 수수께끼로 죽느니 먼저 분명하게 죽는다.
      - name: NVD API 키 확인
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY 시크릿이 없다. dependency-check 13.x 는 키 없이 동작하지 않는다."
            echo "  gh secret set NVD_API_KEY --repo ${{ github.repository }}"
            exit 1
          fi
          echo "NVD API 키 확인됨 (길이 ${#NVD_API_KEY})"

      - name: 의존성 취약점 스캔 (CVSS 7 이상이면 실패)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAggregate --no-daemon

      - name: NVD DB 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-data-${{ github.run_id }}

      - name: 스캔 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.*
          if-no-files-found: ignore

  smoke:
    name: 로컬 스택 스모크
    runs-on: ubuntu-latest
    needs: [verify, integration, frontend]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 이미지 빌드
        run: scripts/build-images.sh

      - name: 스택 기동
        run: |
          docker compose up -d
          scripts/wait-for-healthy.sh 600

      # "떴는가"가 아니라 "돈이 끝까지 흘렀는가"를 본다.
      - name: 스모크 (접수 → 청산 → 원장 → 대사)
        run: scripts/smoke-test.sh

      - name: 실패 시 로그 수집
        if: failure()
        run: docker compose logs --no-color --tail 500

      - name: 정리
        if: always()
        run: docker compose down -v
