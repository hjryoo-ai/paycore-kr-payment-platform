# 정적 파일 서빙 + API 프록시.
#
# 프런트는 상대 경로(/api/v1/...)만 안다. 개발에서는 Vite 프록시가, 운영에서는 이 설정이
# 같은 경로를 같은 서비스로 넘긴다 — 그래야 "로컬에서는 되는데 배포하면 안 되는" 문제가 없다.
# CORS 를 열지 않은 것도 의도다. 브라우저가 백엔드를 직접 부르지 않으면 열 이유가 없다.
server {
    listen 8086;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA. 새로고침해도 index.html 로 되돌린다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/payments {
        proxy_pass http://payment-api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/ops {
        proxy_pass http://payment-api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/recon {
        proxy_pass http://recon-batch:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 대사 실행은 오래 걸릴 수 있다. 기본 60초로는 큰 날짜에서 끊긴다.
        proxy_read_timeout 180s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
