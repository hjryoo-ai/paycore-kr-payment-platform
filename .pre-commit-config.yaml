# 시크릿이 커밋에 실리기 전에 잡는다 (docs §10.2).
#
# CI 에서도 gitleaks 를 돌리지만, CI 는 이미 푸시된 뒤다. 한 번 푸시된 시크릿은
# 커밋을 지워도 유효하지 않다 — 로테이션해야 한다. 그래서 관문은 로컬에도 있어야 한다.
#
# 설치: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-merge-conflict
      - id: end-of-file-fixer
        # 생성물과 바이너리는 건드리지 않는다.
        exclude: '(^gradle/wrapper/|\.jar$|^docs/adr/)'
      - id: trailing-whitespace
        exclude: '(^gradle/wrapper/|\.jar$)'
