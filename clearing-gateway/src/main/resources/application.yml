server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: clearing-gateway
  datasource:
    url: ${PAYCORE_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${PAYCORE_DB_USER:paycore}
    password: ${PAYCORE_DB_PASSWORD:paycore}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true
  # 스키마는 payment-api 만 마이그레이션한다 (ADR-0004).
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${PAYCORE_KAFKA:localhost:29092}
    consumer:
      group-id: ${PAYCORE_GW_GROUP:clearing-gateway}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
  artemis:
    mode: native
    broker-url: ${PAYCORE_JMS_URL:tcp://localhost:61616}
    user: ${PAYCORE_JMS_USER:paycore}
    password: ${PAYCORE_JMS_PASSWORD:paycore}

paycore:
  core:
    events-topic: payment.events
    outbox-poll-interval: 2s
    # 접수 측 재처리는 payment-api 의 책임이다 (ADR-0008).
    sweeper-enabled: false
  gateway:
    member-id: ${PAYCORE_MEMBER_ID:020}
    request-queue: ${PAYCORE_MQ_REQ:CLR.REQ}
    response-queue: ${PAYCORE_MQ_RES:CLR.RES}
    consumer-group: ${PAYCORE_GW_GROUP:clearing-gateway}
    # timeout 은 실패가 아니다 — 이 시간이 지나면 UNKNOWN 으로 두고 pacs.028 로 확인한다 (docs §7.3).
    response-timeout: 10s
    timeout-scan-interval: 5s
    inquiry-scan-interval: 5s
    # 길이가 곧 최대 시도 횟수. 다 쓰면 MANUAL_REVIEW.
    inquiry-backoff: [10s, 30s, 60s]
    dispatch-batch: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    defaults:
      enabled: true

logging:
  level:
    kr.paycore: DEBUG
