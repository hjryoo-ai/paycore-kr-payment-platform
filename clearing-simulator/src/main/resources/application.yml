server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: clearing-simulator
  artemis:
    mode: native
    broker-url: ${PAYCORE_JMS_URL:tcp://localhost:61616}
    user: ${PAYCORE_JMS_USER:paycore}
    password: ${PAYCORE_JMS_PASSWORD:paycore}

paycore:
  simulator:
    request-queue: ${PAYCORE_MQ_REQ:CLR.REQ}
    response-queue: ${PAYCORE_MQ_RES:CLR.RES}
    eod-dir: ${PAYCORE_EOD_DIR:./data/eod}
    # DELAY 모드 기본 지연. 게이트웨이 response-timeout(10s)보다 길어야 timeout 경로를 재현한다.
    default-delay: 15s
    out-of-order-batch: 2
    out-of-order-max-hold: 2s
    zone: Asia/Seoul

management:
  metrics:
    tags:
      # 모든 지표에 서비스 이름을 붙인다. 대시보드에서 어느 프로세스의 값인지 구분해야 한다.
      application: clearing-simulator
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    defaults:
      enabled: true

# 관측성 (docs §10.3)
# 콘솔 로그를 JSON 으로 낸다 — 결제 1건의 전 구간 로그를 endToEndId 로 한 번에 검색하려면
# 사람이 읽기 좋은 줄바꿈보다 기계가 파싱할 수 있는 형태가 먼저다.
# PAYCORE_LOG_FORMAT=  (빈 값) 으로 두면 개발 중에는 평문으로 돌아간다.
logging:
  structured:
    format:
      console: ${PAYCORE_LOG_FORMAT:ecs}
  level:
    kr.paycore: ${PAYCORE_LOG_LEVEL:DEBUG}
