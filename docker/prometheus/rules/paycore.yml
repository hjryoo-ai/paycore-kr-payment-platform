# PayCore-KR 알림 규칙 (docs/payment-platform-design.md §10.3)
#
# 규칙을 고르는 기준은 하나다: **사람이 지금 무언가 해야 하는가**.
# "에러율이 올랐다" 같은 규칙은 넣지 않았다 — 무엇을 하라는 것인지 알 수 없는 알림은
# 몇 번 울리고 나면 아무도 보지 않게 되고, 그때부터는 진짜 알림도 묻힌다.
groups:
  - name: paycore-money
    rules:
      # 돈이 나갔는지 모르는 채로 5분이 지났다. 조회가 3회 다 실패했을 가능성이 높다.
      - alert: PaymentUnknownTooLong
        expr: paycore_payment_unknown_age_seconds > 300
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "UNKNOWN 결제가 5분 넘게 방치됨 ({{ $value | humanizeDuration }})"
          description: >-
            돈이 나갔는지 확인되지 않은 결제가 있다. pacs.028 조회 이력을 먼저 확인하고,
            3회 소진됐다면 MANUAL_REVIEW 워크리스트에서 청산망과 대조한 뒤 repair 한다.
            절대 재송신하지 말 것 — 확인 없는 재송신이 이중 지급이다.

      # 사람 손을 기다리는 건. 방치하면 그대로 EOD 대사 불일치가 된다.
      - alert: PaymentManualReviewPending
        expr: paycore_payment_count{status="MANUAL_REVIEW"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "운영자 확인 대기 결제 {{ $value }}건"
          description: "GET /api/v1/ops/worklist 로 확인하고 근거와 함께 repair 한다."

  - name: paycore-pipeline
    rules:
      # 아웃박스가 안 나가고 있다. 커밋은 됐는데 하류가 모르는 상태라 대사가 반드시 깨진다.
      - alert: OutboxLagging
        expr: paycore_outbox_lag_seconds > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "아웃박스 미발행 이벤트가 {{ $value | humanizeDuration }}째 밀려 있음"
          description: >-
            poller 가 멈췄거나 Kafka 발행이 실패하고 있다. 애플리케이션 로그에서
            '아웃박스 발행 실패' 를 확인한다. 이벤트는 유실되지 않으므로 원인만 제거하면 따라잡는다.

      # DLT 는 0 이 정상이다. 1건이라도 있으면 사람이 원인을 봐야 한다.
      - alert: DeadLetterPending
        expr: paycore_deadletter_open > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "미처리 DLT {{ $value }}건"
          description: >-
            GET /api/v1/ops/dead-letters 로 원인을 확인한다. 자동 재주입은 금지이며,
            원인을 확인한 뒤에만 republish 한다.

  - name: paycore-recon
    rules:
      # 대사 불일치는 닫힐 때까지 계속 보여야 한다. 배치 실행 순간에만 알리면 종일 방치된다.
      - alert: ReconBreakOpen
        expr: paycore_recon_break_open > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "당일 대사 불일치 {{ $value }}건 미해결"
          description: >-
            /app/data/recon 의 리포트에 조사 순서가 적혀 있다.
            MISSING_AT_CLEARING 과 STATUS_MISMATCH 를 먼저 본다 — 돈이 실제로 움직인 쪽이다.

      # 마감이 아예 안 돌았을 수도 있다. 불일치 0건과 '실행 안 됨'은 완전히 다르다.
      - alert: ReconNotRunToday
        expr: absent(paycore_recon_break_open)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "대사 지표가 보이지 않음 — recon-batch 가 떠 있는지 확인"
          description: "불일치 0건과 '마감이 돌지 않음'은 다르다. 후자는 아무것도 보장하지 않는다."
