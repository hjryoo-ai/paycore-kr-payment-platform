global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: paycore
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - payment-api:8081
          - clearing-gateway:8082
          - clearing-simulator:8083
          - ledger-service:8084
          - recon-batch:8085
        labels:
          system: paycore-kr
