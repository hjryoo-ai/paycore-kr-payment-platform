global:
  scrape_interval: 10s
  evaluation_interval: 10s

# 알림 규칙 (docs §10.3). Alertmanager 는 붙이지 않았고 규칙 평가 결과만 노출한다 —
# 포트폴리오에서 증명할 것은 "무엇을 언제 알려야 하는가"이지 알림 전송 경로가 아니다.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: paycore
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - payment-api:8081
          - clearing-gateway:8082
          - clearing-simulator:8083
          - ledger-service:8084
          - recon-batch:8085
        labels:
          system: paycore-kr
