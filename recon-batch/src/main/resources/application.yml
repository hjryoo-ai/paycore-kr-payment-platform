server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: recon-batch
  datasource:
    url: ${PAYCORE_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${PAYCORE_DB_USER:paycore}
    password: ${PAYCORE_DB_PASSWORD:paycore}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true
  # 스키마는 payment-api 만 마이그레이션한다 (ADR-0004).
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${PAYCORE_KAFKA:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

paycore:
  core:
    events-topic: payment.events
    # 대사 배치는 읽기만 한다. 아웃박스 발행도 접수 재처리도 이 프로세스의 책임이 아니다.
    outbox-enabled: false
    sweeper-enabled: false
  recon:
    simulator-base-url: ${PAYCORE_SIMULATOR_URL:http://localhost:8083}
    eod-dir: ${PAYCORE_EOD_DIR:./data/eod}
    report-dir: ${PAYCORE_REPORT_DIR:./data/recon}
    zone: Asia/Seoul
    suspense-account: ${PAYCORE_SUSPENSE_ACCOUNT:CLEARING_SUSPENSE}
    fetch-timeout: 10s

management:
  metrics:
    tags:
      # 모든 지표에 서비스 이름을 붙인다. 대시보드에서 어느 프로세스의 값인지 구분해야 한다.
      application: recon-batch
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    defaults:
      enabled: true

# 관측성 (docs §10.3)
# 콘솔 로그를 JSON 으로 낸다 — 결제 1건의 전 구간 로그를 endToEndId 로 한 번에 검색하려면
# 사람이 읽기 좋은 줄바꿈보다 기계가 파싱할 수 있는 형태가 먼저다.
# PAYCORE_LOG_FORMAT=  (빈 값) 으로 두면 개발 중에는 평문으로 돌아간다.
logging:
  structured:
    format:
      console: ${PAYCORE_LOG_FORMAT:ecs}
  level:
    kr.paycore: ${PAYCORE_LOG_LEVEL:DEBUG}
