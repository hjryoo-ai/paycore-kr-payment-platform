spring:
  jpa:
    hibernate:
      ddl-auto: none
  # 테스트에서는 원장 컨텍스트가 스키마를 만든다. 운영 소유권(ADR-0004)과는 별개다.
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    consumer:
      group-id: ledger-service-it
      auto-offset-reset: earliest

paycore:
  core:
    outbox-poll-interval: 300ms
    sweeper-enabled: false
  ledger:
    consumer-group: ledger-service-it
    suspense-account: CLEARING_SUSPENSE

logging:
  # 테스트 로그는 사람이 읽는다. 구조화 JSON 은 운영 설정이라 여기서만 끈다.
  structured:
    format:
      console:
  level:
    kr.paycore: DEBUG
    org.apache.kafka: WARN

# 테스트 로그는 사람이 읽는다. 구조화 JSON 은 운영 설정이므로 여기서만 끈다.
