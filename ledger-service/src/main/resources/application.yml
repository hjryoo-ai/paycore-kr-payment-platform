server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: ledger-service
  datasource:
    url: ${PAYCORE_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${PAYCORE_DB_USER:paycore}
    password: ${PAYCORE_DB_PASSWORD:paycore}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true
  # 스키마는 payment-api 만 마이그레이션한다 (ADR-0004).
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${PAYCORE_KAFKA:localhost:29092}
    consumer:
      group-id: ${PAYCORE_LEDGER_GROUP:ledger-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record

paycore:
  core:
    events-topic: payment.events
    outbox-poll-interval: 2s
    # 접수 측 재처리는 payment-api 의 책임이다 (ADR-0008 와 같은 이유).
    sweeper-enabled: false
  ledger:
    # 고객 계좌에서 나간 돈이 청산 완료 전까지 머무는 자리 (docs §5.5)
    suspense-account: ${PAYCORE_SUSPENSE_ACCOUNT:CLEARING_SUSPENSE}
    consumer-group: ${PAYCORE_LEDGER_GROUP:ledger-service}

management:
  metrics:
    tags:
      # 모든 지표에 서비스 이름을 붙인다. 대시보드에서 어느 프로세스의 값인지 구분해야 한다.
      application: ledger-service
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    defaults:
      enabled: true

# 관측성 (docs §10.3)
# 콘솔 로그를 JSON 으로 낸다 — 결제 1건의 전 구간 로그를 endToEndId 로 한 번에 검색하려면
# 사람이 읽기 좋은 줄바꿈보다 기계가 파싱할 수 있는 형태가 먼저다.
# PAYCORE_LOG_FORMAT=  (빈 값) 으로 두면 개발 중에는 평문으로 돌아간다.
logging:
  structured:
    format:
      console: ${PAYCORE_LOG_FORMAT:ecs}
  level:
    kr.paycore: ${PAYCORE_LOG_LEVEL:DEBUG}
