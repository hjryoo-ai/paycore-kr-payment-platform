# 통합 테스트 프로파일. DataSource 는 @ServiceConnection 이 컨테이너에서 채워준다.
spring:
  flyway:
    enabled: true
    clean-disabled: false
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: ${PAYCORE_KAFKA:localhost:29092}   # @DynamicPropertySource 가 컨테이너 주소로 덮어쓴다

# 테스트에서는 주기를 짧게 — 단, Thread.sleep 이 아니라 Awaitility 로 기다린다.
paycore:
  core:
    outbox-poll-interval: 300ms
    sweep-interval: 500ms
    stuck-after: 2s
    # 재시도 간격을 줄여 테스트가 시간에 매달리지 않게 한다. 분류 규칙은 운영과 동일하다.
    retry:
      max-attempts: 3
      initial-backoff: 100ms
      backoff-multiplier: 2.0
      max-backoff: 300ms

logging:
  level:
    kr.paycore: DEBUG
    org.testcontainers: INFO
    com.github.dockerjava: WARN
